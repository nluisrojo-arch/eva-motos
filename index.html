<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva Motos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--border:#222;--border2:#2e2e2e;--cyan:#00e5cc;--cyan2:#00b8a6;--cyan3:#003d38;--red:#ff4444;--red2:#2a0e0e;--amber:#f5a623;--amber2:#2e1f00;--muted:#444;--muted2:#777;--muted3:#aaa;--white:#e0e0e0}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.htitle{font-size:15px;font-weight:500;color:var(--cyan);letter-spacing:1px}
.hright{display:flex;align-items:center;gap:10px}
.hdate{font-size:10px;color:var(--muted2);letter-spacing:0.5px}
.sync-status{font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid var(--border2);color:var(--muted2)}
.sync-status.ok{color:#00c97a;border-color:#0f3a20}
.sync-status.saving{color:var(--amber);border-color:#4a2800}
.sync-status.err{color:var(--red);border-color:#4a1010}
.btn-export{padding:5px 12px;font-size:10px;font-weight:500;border-radius:3px;cursor:pointer;border:1px solid var(--cyan2);background:transparent;color:var(--cyan);letter-spacing:0.5px;text-transform:uppercase}
.btn-export:hover{background:var(--cyan3)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border2)}
.stat{background:var(--bg2);padding:9px 12px}
.stat .lbl{font-size:9px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:3px}
.stat .val{font-size:17px;font-weight:500;color:var(--cyan)}
.stat .val.r{color:var(--red)}.stat .val.w{color:var(--white)}.stat .val.a{color:var(--amber)}
.stat .sub{font-size:9px;color:var(--muted);margin-top:1px}
.nav{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border2)}
.nav button{flex:1;padding:8px 2px;font-size:10px;font-weight:500;background:var(--bg2);color:var(--muted2);border:none;cursor:pointer;letter-spacing:0.5px;text-transform:uppercase;transition:all 0.1s;border-bottom:2px solid transparent}
.nav button.active{background:var(--bg3);color:var(--cyan);border-bottom:2px solid var(--cyan)}
.nav button:hover:not(.active){background:var(--bg3);color:var(--muted3)}
.panel{display:none;padding:12px 14px}.panel.active{display:block}
.sec{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sec.mt{margin-top:16px}
.alert{padding:7px 10px;font-size:11px;margin-bottom:10px;border-left:3px solid var(--red);background:var(--red2);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:5px 7px;text-align:left;color:var(--muted);font-weight:500;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;border-bottom:1px solid var(--border2);background:var(--bg2);white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--muted3);vertical-align:middle;white-space:nowrap}
td.cy{color:var(--cyan);font-weight:500}td.re{color:var(--red)}td.am{color:var(--amber)}
tr:hover td{background:var(--bg3)}tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:500}
.bg{background:#0a2a1a;color:#00c97a;border:1px solid #0f3a20}.br{background:var(--red2);color:var(--red);border:1px solid #4a1010}
.ba{background:var(--amber2);color:var(--amber);border:1px solid #4a2800}.bc{background:var(--cyan3);color:var(--cyan);border:1px solid #005a52}
.card{border:1px solid var(--border2);border-radius:5px;margin-bottom:10px;overflow:hidden}
.card-head{background:var(--bg2);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.cr{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--border);gap:6px}
.cr:last-child{border-bottom:none}.cr.venc{background:var(--red2)}
.cbi{display:flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap}
.tc-in{width:72px;font-size:10px;padding:2px 5px;background:var(--bg);border:1px solid var(--border2);color:var(--amber);border-radius:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase}
.fg input,.fg select{font-size:11px;padding:5px 7px;background:var(--bg3);border:1px solid var(--border2);color:var(--white);border-radius:3px}
.fg input:focus,.fg select:focus{border-color:var(--cyan2);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-bottom:10px}
.btn{padding:6px 14px;font-size:11px;font-weight:500;border-radius:3px;cursor:pointer;border:1px solid var(--cyan2);background:transparent;color:var(--cyan)}
.btn:hover{background:var(--cyan3)}
.btn-sm{padding:4px 10px;font-size:10px;border-radius:3px;cursor:pointer;border:1px solid var(--cyan2);background:transparent;color:var(--cyan);margin-bottom:8px}
.btnd{border-color:var(--border2);color:var(--muted);padding:2px 7px;font-size:10px}
.btnd:hover{border-color:var(--red);color:var(--red);background:var(--red2)}
.form-box{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:12px;margin-bottom:12px}
.sub-label{font-size:9px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin:8px 0 5px}
.echeq-item{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.echeq-item input{font-size:11px;padding:4px 7px;background:var(--bg);border:1px solid var(--border2);color:var(--white);border-radius:3px;flex:1;min-width:0}
.echeq-item button{padding:3px 8px;font-size:10px;border-radius:3px;cursor:pointer;border:1px solid #4a1010;background:var(--red2);color:var(--red);flex-shrink:0}
@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.nav button{font-size:9px;padding:8px 1px}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <span class="htitle">EVA MOTOS</span>
  <div class="hright">
    <span class="sync-status" id="sync-status">Cargando...</span>
    <span class="hdate" id="fhoy"></span>
    <button class="btn-export" onclick="exportarExcel()">&#8595; Excel</button>
  </div>
</div>
<div class="stats" id="sbar"></div>
<div class="nav">
  <button class="active" onclick="sp(this,'compras')">Compras</button>
  <button onclick="sp(this,'gastos')">Gastos</button>
  <button onclick="sp(this,'ventas')">Ventas</button>
  <button onclick="sp(this,'resumen')">Resumen</button>
  <button onclick="sp(this,'stock')">Stock</button>
</div>

<!-- COMPRAS -->
<div class="panel active" id="panel-compras">
  <div class="sec">Nueva compra</div>
  <div class="form-box">
    <div class="fgrid">
      <div class="fg"><label>Marca</label><input type="text" id="nc-marca" placeholder="Husqvarna"></div>
      <div class="fg"><label>Modelo</label><input type="text" id="nc-modelo" placeholder="TE 300"></div>
      <div class="fg"><label>Año</label><input type="number" id="nc-anio" placeholder="2024"></div>
      <div class="fg"><label>Costo base ($)</label><input type="number" id="nc-costo" placeholder="0"></div>
    </div>
    <div class="sub-label">Echeqs de compra al proveedor</div>
    <div id="nc-echeqs">
      <div class="echeq-item">
        <input type="date" style="max-width:130px">
        <input type="number" placeholder="Monto $">
        <button onclick="this.parentElement.remove()">x</button>
      </div>
    </div>
    <button class="btn-sm" onclick="agregarEcheqCompra()">+ Echeq</button>
    <div class="sub-label">Gastos extra (imp. cheque, retiro, accesorios...)</div>
    <div id="nc-gastos"></div>
    <button class="btn-sm" onclick="agregarGastoNuevaCompra()">+ Gasto</button>
    <br style="margin-top:4px">
    <button class="btn" onclick="guardarNuevaCompra()">Guardar compra</button>
  </div>

  <div class="sec mt">Pagos al proveedor — operaciones vendidas</div>
  <div id="compras-content"></div>

  <div class="sec mt">Agregar gasto a compra existente</div>
  <div class="fgrid">
    <div class="fg"><label>Operacion</label><select id="gc-op"></select></div>
    <div class="fg"><label>Descripcion</label><input type="text" id="gc-desc" placeholder="Flete, accesorios..."></div>
    <div class="fg"><label>Monto ($)</label><input type="number" id="gc-monto" placeholder="0"></div>
    <div class="fg"><label>Fecha</label><input type="date" id="gc-fecha"></div>
  </div>
  <button class="btn" onclick="guardarGastoCompra()">Agregar gasto</button>
</div>

<!-- GASTOS -->
<div class="panel" id="panel-gastos">
  <div class="sec">Nuevo gasto general</div>
  <div class="fgrid">
    <div class="fg"><label>Descripcion</label><input type="text" id="g-desc" placeholder="Instagram..."></div>
    <div class="fg"><label>Categoria</label><select id="g-cat"><option value="publicidad">Publicidad</option><option value="accesorios">Accesorios</option><option value="operativo">Operativo</option><option value="otro">Otro</option></select></div>
    <div class="fg"><label>Monto ($)</label><input type="number" id="g-monto" placeholder="0"></div>
    <div class="fg"><label>A cargo de</label><select id="g-quien"><option value="ambos">Ambos</option><option value="lucho">Lucho</option><option value="miguel">Miguel</option></select></div>
    <div class="fg"><label>Fecha</label><input type="date" id="g-fecha"></div>
  </div>
  <button class="btn" onclick="guardarGasto()">Guardar</button>
  <div class="sec mt">Historial</div>
  <div id="tgastos"></div>
</div>

<!-- VENTAS -->
<div class="panel" id="panel-ventas">
  <div class="sec">Nueva venta</div>
  <div class="form-box">
    <div class="fgrid">
      <div class="fg"><label>Moto (del stock)</label><select id="nv-stock"></select></div>
      <div class="fg"><label>Cliente</label><input type="text" id="nv-cliente" placeholder="Nombre"></div>
      <div class="fg"><label>Precio venta USD</label><input type="number" id="nv-usd" placeholder="0"></div>
    </div>
    <div class="sub-label">Cuotas / Echeqs de cobro</div>
    <div id="nv-cuotas">
      <div class="echeq-item">
        <input type="text" placeholder="Cuota 1" style="max-width:80px">
        <input type="date" style="max-width:130px">
        <input type="number" placeholder="USD">
        <button onclick="this.parentElement.remove()">x</button>
      </div>
    </div>
    <button class="btn-sm" onclick="agregarCuotaVenta()">+ Cuota / Echeq</button>
    <br style="margin-top:4px">
    <button class="btn" onclick="guardarNuevaVenta()">Guardar venta</button>
  </div>

  <div class="sec mt">Cobros por operacion</div>
  <div id="ventas-content"></div>
</div>

<!-- RESUMEN -->
<div class="panel" id="panel-resumen"><div id="dash"></div></div>

<!-- STOCK -->
<div class="panel" id="panel-stock">
  <div class="sec">Stock disponible</div>
  <div id="stock-content"></div>
</div>
</div>

<script>
const hoy=new Date().toISOString().split('T')[0];
document.getElementById('fhoy').textContent=new Date().toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase();
document.getElementById('g-fecha').value=hoy;
document.getElementById('gc-fecha').value=hoy;

let state={ops:[],stock:[],gastos:[]};
let saveTimer=null;

function setStatus(s){const el=document.getElementById('sync-status');el.className='sync-status '+s;el.textContent=s==='ok'?'Sincronizado':s==='saving'?'Guardando...':'Sin conexion'}

async function loadData(){
  try{const r=await fetch('/api/data');const d=await r.json();if(d&&d.ops)state=d;else seedDefault();setStatus('ok');}
  catch(e){const local=localStorage.getItem('eva-motos-state');if(local)state=JSON.parse(local);else seedDefault();setStatus('err');}
  renderAll();
}

async function saveData(){
  setStatus('saving');localStorage.setItem('eva-motos-state',JSON.stringify(state));
  try{await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});setStatus('ok');}
  catch(e){setStatus('err');}
}

function scheduleSave(){if(saveTimer)clearTimeout(saveTimer);saveTimer=setTimeout(saveData,800)}
function uid(){return Date.now()+Math.random().toString(36).slice(2,6)}
function fmtS(n){return'$'+Math.round(n||0).toLocaleString('es-AR')}
function fmtU(n){return'U$D '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtF(f){if(!f)return'-';const[y,m,d]=String(f).split('-');return d+'/'+m+'/'+y}

function agregarEcheqCompra(){
  const d=document.createElement('div');d.className='echeq-item';
  d.innerHTML='<input type="date" style="max-width:130px"><input type="number" placeholder="Monto $"><button onclick="this.parentElement.remove()">x</button>';
  document.getElementById('nc-echeqs').appendChild(d);
}
function agregarGastoNuevaCompra(){
  const d=document.createElement('div');d.className='echeq-item';
  d.innerHTML='<input type="text" placeholder="Descripcion"><input type="number" placeholder="Monto $"><button onclick="this.parentElement.remove()">x</button>';
  document.getElementById('nc-gastos').appendChild(d);
}
function agregarCuotaVenta(){
  const n=document.getElementById('nv-cuotas').children.length+1;
  const d=document.createElement('div');d.className='echeq-item';
  d.innerHTML='<input type="text" placeholder="Cuota '+n+'" style="max-width:80px"><input type="date" style="max-width:130px"><input type="number" placeholder="USD"><button onclick="this.parentElement.remove()">x</button>';
  document.getElementById('nv-cuotas').appendChild(d);
}

function guardarNuevaCompra(){
  const marca=document.getElementById('nc-marca').value.trim();
  const modelo=document.getElementById('nc-modelo').value.trim();
  const costo=parseFloat(document.getElementById('nc-costo').value)||0;
  if(!marca||!modelo){alert('Completa marca y modelo.');return}
  const echeqs=[];
  document.getElementById('nc-echeqs').querySelectorAll('.echeq-item').forEach((el,i)=>{
    const ins=el.querySelectorAll('input');const fecha=ins[0].value;const monto=parseFloat(ins[1].value)||0;
    if(fecha&&monto)echeqs.push({label:'Echeq '+(i+1),fecha,monto,pagado:false});
  });
  const gastos=[];
  document.getElementById('nc-gastos').querySelectorAll('.echeq-item').forEach(el=>{
    const ins=el.querySelectorAll('input');const desc=ins[0].value.trim();const monto=parseFloat(ins[1].value)||0;
    if(desc&&monto)gastos.push({desc,monto});
  });
  state.stock.unshift({id:uid(),marca,modelo,anio:document.getElementById('nc-anio').value,precioUSD:0,estado:'disponible',notas:'',compra:{costo,gastos,echeqs}});
  scheduleSave();
  ['nc-marca','nc-modelo','nc-anio','nc-costo'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('nc-echeqs').innerHTML='<div class="echeq-item"><input type="date" style="max-width:130px"><input type="number" placeholder="Monto $"><button onclick="this.parentElement.remove()">x</button></div>';
  document.getElementById('nc-gastos').innerHTML='';
  renderAll();alert('Compra guardada. La moto quedo en Stock.');
}

function guardarNuevaVenta(){
  const stockId=document.getElementById('nv-stock').value;
  const cliente=document.getElementById('nv-cliente').value.trim();
  const usd=parseFloat(document.getElementById('nv-usd').value)||0;
  if(!stockId||!cliente||!usd){alert('Completa todos los campos.');return}
  const s=state.stock.find(x=>x.id===stockId);
  if(!s){alert('Moto no encontrada.');return}
  const cuotas=[];
  document.getElementById('nv-cuotas').querySelectorAll('.echeq-item').forEach((el,i)=>{
    const ins=el.querySelectorAll('input');
    const label=ins[0].value.trim()||('Cuota '+(i+1));
    const fecha=ins[1].value;const usdVal=parseFloat(ins[2].value)||0;
    if(fecha&&usdVal)cuotas.push({label,fecha,usd:usdVal,tc:null,pagado:false});
  });
  state.stock=state.stock.filter(x=>x.id!==stockId);
  state.ops.unshift({id:uid(),nombre:s.marca+' '+s.modelo+(s.anio?' '+s.anio:''),cliente,compra:s.compra||{costo:0,gastos:[],echeqs:[]},venta:{precioUSD:usd,cuotas}});
  scheduleSave();
  ['nv-cliente','nv-usd'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('nv-cuotas').innerHTML='<div class="echeq-item"><input type="text" placeholder="Cuota 1" style="max-width:80px"><input type="date" style="max-width:130px"><input type="number" placeholder="USD"><button onclick="this.parentElement.remove()">x</button></div>';
  renderAll();alert('Venta guardada.');
}

function guardarGastoCompra(){
  const opId=document.getElementById('gc-op').value;const desc=document.getElementById('gc-desc').value.trim();const monto=parseFloat(document.getElementById('gc-monto').value)||0;
  if(!desc||!monto){alert('Completa descripcion y monto.');return}
  const op=state.ops.find(o=>o.id===opId);
  if(op){op.compra.gastos.push({desc,monto});scheduleSave();}
  document.getElementById('gc-desc').value='';document.getElementById('gc-monto').value='';renderAll();
}
function guardarGasto(){
  const desc=document.getElementById('g-desc').value.trim();const monto=parseFloat(document.getElementById('g-monto').value)||0;
  if(!desc||!monto){alert('Completa descripcion y monto.');return}
  state.gastos.unshift({id:uid(),desc,cat:document.getElementById('g-cat').value,monto,quien:document.getElementById('g-quien').value,fecha:document.getElementById('g-fecha').value});
  scheduleSave();['g-desc','g-monto'].forEach(id=>document.getElementById(id).value='');renderAll();
}
function elimGasto(id){if(!confirm('Eliminar?'))return;state.gastos=state.gastos.filter(g=>g.id!==id);scheduleSave();renderAll()}
function toggleCompraOp(opId,idx){const op=state.ops.find(o=>o.id===opId);if(op)op.compra.echeqs[idx].pagado=!op.compra.echeqs[idx].pagado;scheduleSave();renderAll()}
function toggleVenta(opId,idx){const op=state.ops.find(o=>o.id===opId);if(op)op.venta.cuotas[idx].pagado=!op.venta.cuotas[idx].pagado;scheduleSave();renderAll()}
function saveTc(opId,idx,val){const op=state.ops.find(o=>o.id===opId);if(op&&op.venta.cuotas[idx])op.venta.cuotas[idx].tc=parseFloat(val)||null;scheduleSave()}
function toggleCompraStock(sId,idx){const s=state.stock.find(x=>x.id===sId);if(s&&s.compra)s.compra.echeqs[idx].pagado=!s.compra.echeqs[idx].pagado;scheduleSave();renderAll()}

function sp(btn,name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');btn.classList.add('active');renderAll();
}
function cobradoUSD(op){return op.venta.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+(c.usd||(c.ars?(c.ars/(c.tc||1)):0)),0)}

function seedDefault(){
  state={
    ops:[
      {id:'tx300',nombre:'Husqvarna TX 300 2024',cliente:'Roberto Giurich',
       compra:{costo:20900000,gastos:[{desc:'Imp. cheque',monto:250800},{desc:'Retiro',monto:266667},{desc:'Protector',monto:300000}],echeqs:[{label:'30/03',fecha:'2026-03-30',monto:3483333,pagado:true},{label:'30/04',fecha:'2026-04-30',monto:3483333,pagado:true},{label:'30/05',fecha:'2026-05-30',monto:3483333,pagado:false},{label:'30/06',fecha:'2026-06-30',monto:3483333,pagado:false},{label:'30/07',fecha:'2026-07-30',monto:3483333,pagado:false},{label:'30/08',fecha:'2026-08-30',monto:3483333,pagado:false}]},
       venta:{precioUSD:17100,cuotas:[{label:'Cuota 1',fecha:'2026-04-27',usd:3000,tc:null,pagado:false},{label:'Cuota 2',fecha:'2026-05-27',usd:2350,tc:null,pagado:false},{label:'Cuota 3',fecha:'2026-06-27',usd:2350,tc:null,pagado:false},{label:'Cuota 4',fecha:'2026-07-27',usd:2350,tc:null,pagado:false},{label:'Cuota 5',fecha:'2026-08-27',usd:2350,tc:null,pagado:false},{label:'Cuota 6',fecha:'2026-09-20',usd:2350,tc:null,pagado:false},{label:'Cuota 7',fecha:'2026-10-20',usd:2350,tc:null,pagado:false}]}},

function renderStats(){
  const{ops,stock}=state;
  const totalUSD=ops.reduce((s,o)=>s+o.venta.precioUSD,0);
  const cobUSD=ops.reduce((s,o)=>s+cobradoUSD(o),0);
  const vencV=ops.reduce((s,o)=>s+o.venta.cuotas.filter(c=>!c.pagado&&c.fecha<hoy).length,0);
  const comprasPend=ops.reduce((s,o)=>s+(o.compra.echeqs||[]).filter(e=>!e.pagado).reduce((a,e)=>a+e.monto,0),0)+stock.reduce((s,x)=>s+((x.compra&&x.compra.echeqs)||[]).filter(e=>!e.pagado).reduce((a,e)=>a+e.monto,0),0);
  document.getElementById('sbar').innerHTML='<div class="stat"><div class="lbl">Cobrado</div><div class="val">'+fmtU(cobUSD)+'</div></div><div class="stat"><div class="lbl">Por cobrar</div><div class="val a">'+fmtU(totalUSD-cobUSD)+'</div></div><div class="stat"><div class="lbl">Cuotas vencidas</div><div class="val '+(vencV>0?'r':'w')+'">'+vencV+'</div></div><div class="stat"><div class="lbl">Pagos compra pend.</div><div class="val w">'+fmtS(comprasPend)+'</div></div><div class="stat"><div class="lbl">Stock</div><div class="val w">'+stock.filter(s=>s.estado==='disponible').length+'</div><div class="sub">motos disponibles</div></div>';
}

function renderCompras(){
  const{ops,stock}=state;
  document.getElementById('gc-op').innerHTML=ops.map(o=>'<option value="'+o.id+'">'+o.nombre+' - '+o.cliente+'</option>').join('');
  function renderB(nombre,cliente,compra,fn,id){
    const ec=compra.echeqs||[];const gs=compra.gastos||[];
    const pag=ec.filter(e=>e.pagado).reduce((s,e)=>s+e.monto,0);const tot=ec.reduce((s,e)=>s+e.monto,0);
    const gT=gs.reduce((s,g)=>s+g.monto,0);const venc=ec.filter(e=>!e.pagado&&e.fecha<hoy).length;const pct=tot>0?Math.round(pag/tot*100):0;
    return '<div class="card"><div class="card-head"><span style="color:var(--white);font-size:12px;font-weight:500">'+nombre+(cliente?' <span style="color:#666;font-weight:400">- '+cliente+'</span>':'')+'</span><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--red);font-size:11px">'+fmtS(pag)+' / '+fmtS(tot)+'</span>'+(venc>0?'<span class="badge br">'+venc+' venc.</span>':'')+'</div></div>'
      +'<table><thead><tr><th>Costo base</th><th>Gastos extra</th><th>Costo total</th><th>Pagado</th><th>Pendiente</th></tr></thead><tbody><tr><td class="re">'+fmtS(compra.costo)+'</td><td class="am">'+fmtS(gT)+'</td><td class="re">'+fmtS(compra.costo+gT)+'</td><td class="re">'+fmtS(pag)+' ('+pct+'%)</td><td class="re">'+fmtS(tot-pag)+'</td></tr></tbody></table>'
      +'<div style="padding:4px 7px;font-size:9px;color:#3a3a3a;border-top:1px solid var(--border)">'+( gs.map(g=>g.desc+' '+fmtS(g.monto)).join(' - ')||'Sin gastos extra')+'</div>'
      +ec.map((e,i)=>'<div class="cr'+(!e.pagado&&e.fecha<hoy?' venc':'')+'"><span style="font-size:11px;color:#888;min-width:55px">'+e.label+'</span><span style="font-size:11px;color:#666;min-width:65px">'+fmtF(e.fecha)+'</span><span class="re" style="font-size:11px;min-width:100px">'+fmtS(e.monto)+'</span><div class="cbi"><input type="checkbox" '+(e.pagado?'checked':'')+' onchange="'+fn+'(\''+id+'\','+i+')" style="width:13px;height:13px;accent-color:#00e5cc"><span style="color:'+(e.pagado?'#00c97a':(!e.pagado&&e.fecha<hoy?'var(--red)':'#444'))+'">'+( e.pagado?'Pagado':(!e.pagado&&e.fecha<hoy?'VENCIDO':'Pendiente'))+'</span></div></div>').join('')+'</div>';
  }
  document.getElementById('compras-content').innerHTML=
    ops.map(o=>renderB(o.nombre,o.cliente,o.compra,'toggleCompraOp',o.id)).join('')+
    stock.map(s=>renderB(s.marca+' '+s.modelo+(s.anio?' '+s.anio:''),null,s.compra||{costo:0,gastos:[],echeqs:[]},'toggleCompraStock',s.id)).join('');
}

  }).join('');

function renderResumen(){
  const{ops,stock}=state;
  const venc=ops.reduce((s,o)=>s+o.venta.cuotas.filter(c=>!c.pagado&&c.fecha<hoy).length,0);
  const proxV=ops.flatMap(o=>o.venta.cuotas.filter(c=>!c.pagado&&c.fecha>=hoy).map(c=>Object.assign({},c,{op:o.nombre+' - '+o.cliente}))).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8);
  const proxC=[...ops.flatMap(o=>(o.compra.echeqs||[]).filter(e=>!e.pagado).map(e=>Object.assign({},e,{op:o.nombre+' - '+o.cliente}))),
    ...stock.flatMap(s=>((s.compra&&s.compra.echeqs)||[]).filter(e=>!e.pagado).map(e=>Object.assign({},e,{op:s.marca+' '+s.modelo+' (stock)'})))].sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8);
  let html=venc?'<div class="alert">'+venc+' cuota'+(venc>1?'s':'')+' vencida'+(venc>1?'s':'')+' sin cobrar</div>':'';
  html+='<div class="two"><div><div class="sec">Proximos cobros</div><table><thead><tr><th>Fecha</th><th>Operacion</th><th>USD</th></tr></thead><tbody>'+(proxV.length?proxV.map(c=>'<tr><td>'+fmtF(c.fecha)+'</td><td style="color:#555">'+c.op+'</td><td class="cy">'+fmtU(c.usd||(c.ars?(c.ars/(c.tc||1)):0))+'</td></tr>').join(''):'<tr><td colspan="3" style="color:#333;text-align:center;padding:10px">Todo al dia</td></tr>')+'</tbody></table></div>'
    +'<div><div class="sec">Proximos pagos de compra</div><table><thead><tr><th>Fecha</th><th>Operacion</th><th>$</th></tr></thead><tbody>'+(proxC.length?proxC.map(e=>'<tr><td style="'+(e.fecha<hoy?'color:var(--red)':'')+'">'+fmtF(e.fecha)+'</td><td style="color:#555">'+e.op+'</td><td class="re">'+fmtS(e.monto)+'</td></tr>').join(''):'<tr><td colspan="3" style="color:#333;text-align:center;padding:10px">Sin pagos pendientes</td></tr>')+'</tbody></table></div></div>';
  document.getElementById('dash').innerHTML=html;
}

function exportarExcel(){
  const{ops,stock,gastos}=state;const wb=XLSX.utils.book_new();
  const cR=[['Moto','Cliente','Echeq/Gasto','Fecha','Monto $','Estado']];
  [...ops,...stock.map(s=>Object.assign({},s,{cliente:'(stock)'}))].forEach(op=>{
    const c=op.compra||{costo:0,gastos:[],echeqs:[]};const n=op.nombre||(op.marca+' '+op.modelo);
    (c.echeqs||[]).forEach(e=>cR.push([n,op.cliente||'',e.label,fmtF(e.fecha),e.monto,e.pagado?'Pagado':'Pendiente']));
    (c.gastos||[]).forEach(g=>cR.push([n,op.cliente||'',g.desc,'-',g.monto,'Gasto extra']));
    cR.push([n,op.cliente||'','COSTO TOTAL','-',c.costo+(c.gastos||[]).reduce((s,g)=>s+g.monto,0),'']);cR.push([]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cR),'Compras');
  const vR=[['Moto','Cliente','Cuota','Fecha','USD','TC','$ ARS','Estado']];
  ops.forEach(op=>{op.venta.cuotas.forEach(c=>{const u=c.usd||(c.ars&&c.tc?c.ars/c.tc:null);const a=c.ars||(c.usd&&c.tc?c.usd*c.tc:null);vR.push([op.nombre,op.cliente,c.label,fmtF(c.fecha),u?Math.round(u):'',c.tc||'',a?Math.round(a):'',c.pagado?'Cobrado':'Pendiente'])});vR.push([op.nombre,op.cliente,'TOTAL','-',op.venta.precioUSD,'','','']);vR.push([]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(vR),'Ventas');
  const gR=[['Descripcion','Categoria','Monto $','A cargo de','Fecha']];
  gastos.forEach(g=>gR.push([g.desc,g.cat,g.monto,g.quien,fmtF(g.fecha)]));
  gR.push([]);gR.push(['TOTAL','','',gastos.reduce((s,g)=>s+g.monto,0),'']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gR),'Gastos');
  XLSX.writeFile(wb,'EvaMotos_'+hoy+'.xlsx');
}
