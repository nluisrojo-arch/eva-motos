<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eva Motos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--border:#222;--border2:#2e2e2e;--cyan:#00e5cc;--cyan2:#00b8a6;--cyan3:#003d38;--red:#ff4444;--red2:#2a0e0e;--amber:#f5a623;--amber2:#2e1f00;--muted:#444;--muted2:#777;--muted3:#aaa;--white:#e0e0e0}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto}
.header{background:var(--bg2);border-bottom:1px solid var(--border2);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.htitle{font-size:15px;font-weight:500;color:var(--cyan);letter-spacing:1px}
.hright{display:flex;align-items:center;gap:10px}
.hdate{font-size:10px;color:var(--muted2);letter-spacing:0.5px}
.sync-status{font-size:10px;padding:3px 8px;border-radius:3px;border:1px solid var(--border2);color:var(--muted2)}
.sync-status.ok{color:#00c97a;border-color:#0f3a20}
.sync-status.saving{color:var(--amber);border-color:#4a2800}
.sync-status.err{color:var(--red);border-color:#4a1010}
.btn-export{padding:5px 12px;font-size:10px;font-weight:500;border-radius:3px;cursor:pointer;border:1px solid var(--cyan2);background:transparent;color:var(--cyan);letter-spacing:0.5px;text-transform:uppercase}
.btn-export:hover{background:var(--cyan3)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border2)}
.stat{background:var(--bg2);padding:9px 12px}
.stat .lbl{font-size:9px;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:3px}
.stat .val{font-size:17px;font-weight:500;color:var(--cyan)}
.stat .val.r{color:var(--red)}.stat .val.w{color:var(--white)}.stat .val.a{color:var(--amber)}
.stat .sub{font-size:9px;color:var(--muted);margin-top:1px}
.nav{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border2)}
.nav button{flex:1;padding:8px 2px;font-size:10px;font-weight:500;background:var(--bg2);color:var(--muted2);border:none;cursor:pointer;letter-spacing:0.5px;text-transform:uppercase;transition:all 0.1s;border-bottom:2px solid transparent}
.nav button.active{background:var(--bg3);color:var(--cyan);border-bottom:2px solid var(--cyan)}
.nav button:hover:not(.active){background:var(--bg3);color:var(--muted3)}
.panel{display:none;padding:12px 14px}.panel.active{display:block}
.sec{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.sec.mt{margin-top:16px}
.alert{padding:7px 10px;font-size:11px;margin-bottom:10px;border-left:3px solid var(--red);background:var(--red2);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{padding:5px 7px;text-align:left;color:var(--muted);font-weight:500;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;border-bottom:1px solid var(--border2);background:var(--bg2);white-space:nowrap}
td{padding:5px 7px;border-bottom:1px solid var(--border);color:var(--muted3);vertical-align:middle;white-space:nowrap}
td.cy{color:var(--cyan);font-weight:500}td.re{color:var(--red)}td.am{color:var(--amber)}td.wh{color:var(--white);font-weight:500}
tr:hover td{background:var(--bg3)}tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;font-weight:500}
.bg{background:#0a2a1a;color:#00c97a;border:1px solid #0f3a20}.br{background:var(--red2);color:var(--red);border:1px solid #4a1010}
.ba{background:var(--amber2);color:var(--amber);border:1px solid #4a2800}.bc{background:var(--cyan3);color:var(--cyan);border:1px solid #005a52}
.card{border:1px solid var(--border2);border-radius:5px;margin-bottom:10px;overflow:hidden}
.card-head{background:var(--bg2);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.cr{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--border);gap:6px}
.cr:last-child{border-bottom:none}.cr.venc{background:var(--red2)}
.cbi{display:flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap}
.tc-in{width:72px;font-size:10px;padding:2px 5px;background:var(--bg);border:1px solid var(--border2);color:var(--amber);border-radius:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase}
.fg input,.fg select{font-size:11px;padding:5px 7px;background:var(--bg3);border:1px solid var(--border2);color:var(--white);border-radius:3px}
.fg input:focus,.fg select:focus{border-color:var(--cyan2);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px;margin-bottom:10px}
.btn{padding:6px 14px;font-size:11px;font-weight:500;border-radius:3px;cursor:pointer;border:1px solid var(--cyan2);background:transparent;color:var(--cyan)}
.btn:hover{background:var(--cyan3)}
.btnd{border-color:var(--border2);color:var(--muted);padding:2px 7px;font-size:10px}
.btnd:hover{border-color:var(--red);color:var(--red);background:var(--red2)}
@media(max-width:600px){.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.nav button{font-size:9px;padding:8px 1px}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <span class="htitle">EVA MOTOS</span>
  <div class="hright">
    <span class="sync-status" id="sync-status">Cargando...</span>
    <span class="hdate" id="fhoy"></span>
    <button class="btn-export" onclick="exportarExcel()">⬇ Excel</button>
  </div>
</div>
<div class="stats" id="sbar"></div>
<div class="nav">
  <button class="active" onclick="sp(this,'compras')">Compras</button>
  <button onclick="sp(this,'gastos')">Gastos</button>
  <button onclick="sp(this,'ventas')">Ventas</button>
  <button onclick="sp(this,'resumen')">Resumen</button>
  <button onclick="sp(this,'stock')">Stock</button>
  <button onclick="sp(this,'nueva')">+ Nueva</button>
</div>

<div class="panel active" id="panel-compras">
  <div class="sec">Pagos al proveedor por operación</div>
  <div id="compras-content"></div>
  <div class="sec mt">Agregar gasto de compra</div>
  <div class="fgrid">
    <div class="fg"><label>Operación</label><select id="gc-op"></select></div>
    <div class="fg"><label>Descripción</label><input type="text" id="gc-desc" placeholder="Flete, accesorios..."></div>
    <div class="fg"><label>Monto ($)</label><input type="number" id="gc-monto" placeholder="0"></div>
    <div class="fg"><label>Fecha</label><input type="date" id="gc-fecha"></div>
  </div>
  <button class="btn" onclick="guardarGastoCompra()">Agregar gasto</button>
</div>

<div class="panel" id="panel-gastos">
  <div class="sec">Gastos generales</div>
  <div class="fgrid">
    <div class="fg"><label>Descripción</label><input type="text" id="g-desc" placeholder="Instagram..."></div>
    <div class="fg"><label>Categoría</label><select id="g-cat"><option value="publicidad">Publicidad</option><option value="accesorios">Accesorios</option><option value="operativo">Operativo</option><option value="otro">Otro</option></select></div>
    <div class="fg"><label>Monto ($)</label><input type="number" id="g-monto" placeholder="0"></div>
    <div class="fg"><label>A cargo de</label><select id="g-quien"><option value="ambos">Ambos</option><option value="lucho">Lucho</option><option value="miguel">Miguel</option></select></div>
    <div class="fg"><label>Fecha</label><input type="date" id="g-fecha"></div>
  </div>
  <button class="btn" onclick="guardarGasto()">Guardar</button>
  <div class="sec mt">Historial</div><div id="tgastos"></div>
</div>

<div class="panel" id="panel-ventas">
  <div class="sec">Cobros por operación</div>
  <div id="ventas-content"></div>
</div>

<div class="panel" id="panel-resumen"><div id="dash"></div></div>

<div class="panel" id="panel-stock">
  <div class="sec">Stock disponible</div>
  <div id="stock-content"></div>
  <div class="sec mt">Agregar moto al stock</div>
  <div class="fgrid">
    <div class="fg"><label>Marca</label><input type="text" id="s-marca" placeholder="Husqvarna"></div>
    <div class="fg"><label>Modelo</label><input type="text" id="s-modelo" placeholder="TE 300"></div>
    <div class="fg"><label>Año</label><input type="number" id="s-anio" placeholder="2024"></div>
    <div class="fg"><label>Costo ($)</label><input type="number" id="s-costo" placeholder="0"></div>
    <div class="fg"><label>Precio USD</label><input type="number" id="s-usd" placeholder="0"></div>
    <div class="fg"><label>Notas</label><input type="text" id="s-notas" placeholder="Color, km..."></div>
  </div>
  <button class="btn" onclick="guardarStock()">Agregar</button>
</div>

<div class="panel" id="panel-nueva">
  <div class="sec">Nueva operación</div>
  <div class="fgrid">
    <div class="fg"><label>Cliente</label><input type="text" id="v-cliente" placeholder="Nombre"></div>
    <div class="fg"><label>Moto</label><input type="text" id="v-moto" placeholder="Marca y modelo"></div>
    <div class="fg"><label>Precio venta USD</label><input type="number" id="v-usd" placeholder="0"></div>
    <div class="fg"><label>Costo compra ($)</label><input type="number" id="v-costo" placeholder="0"></div>
    <div class="fg"><label>Cant. cuotas</label><input type="number" id="v-cuotas" placeholder="6" min="1"></div>
    <div class="fg"><label>Fecha primer cobro</label><input type="date" id="v-fecha"></div>
    <div class="fg"><label>Notas</label><input type="text" id="v-notas" placeholder=""></div>
  </div>
  <button class="btn" onclick="guardarVenta()">Guardar</button>
</div>
</div>

<script>
const hoy=new Date().toISOString().split('T')[0];
document.getElementById('fhoy').textContent=new Date().toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase();
document.getElementById('v-fecha').value=hoy;
document.getElementById('g-fecha').value=hoy;
document.getElementById('gc-fecha').value=hoy;

// ---- ESTADO GLOBAL ----
let state = { ops: [], stock: [], gastos: [] };
let saveTimer = null;

function setStatus(s){ const el=document.getElementById('sync-status'); el.className='sync-status '+s; el.textContent=s==='ok'?'Sincronizado':s==='saving'?'Guardando...':'Sin conexión'; }

// ---- SYNC CON API ----
async function loadData(){
  try{
    const r = await fetch('/api/data');
    const d = await r.json();
    if(d.ops) state = d;
    else seedDefault();
    setStatus('ok');
  } catch(e){
    // fallback a localStorage
    const local = localStorage.getItem('eva-motos-state');
    if(local) state = JSON.parse(local);
    else seedDefault();
    setStatus('err');
  }
  renderAll();
}

async function saveData(){
  setStatus('saving');
  localStorage.setItem('eva-motos-state', JSON.stringify(state));
  try{
    await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    setStatus('ok');
  } catch(e){ setStatus('err'); }
}

function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 800);
}

function uid(){return Date.now()+Math.random().toString(36).slice(2,6)}
function fmtS(n){return'$'+Math.round(n||0).toLocaleString('es-AR')}
function fmtU(n){return'U$D '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0})}
function fmtF(f){if(!f)return'-';const[y,m,d]=String(f).split('-');return`${d}/${m}/${y}`}

    ],
    stock:[{id:'te300',marca:'Husqvarna',modelo:'TE 300',anio:'2023',precioUSD:16000,estado:'disponible',notas:'0km · USD 16.000 al TC del cobro',
      compra:{costo:19170000,gastos:[{desc:'Imp. cheque',monto:230040},{desc:'Retiro',monto:266667},{desc:'Protector',monto:300000}],
        echeqs:[{label:'30/03',fecha:'2026-03-30',monto:3195000,pagado:true},{label:'30/04',fecha:'2026-04-30',monto:3195000,pagado:false},{label:'30/05',fecha:'2026-05-30',monto:3195000,pagado:false},{label:'30/06',fecha:'2026-06-30',monto:3195000,pagado:false},{label:'30/07',fecha:'2026-07-30',monto:3195000,pagado:false},{label:'30/08',fecha:'2026-08-30',monto:3195000,pagado:false}]}}],
    gastos:[{id:uid(),desc:'Instagram',cat:'publicidad',monto:60000,quien:'ambos',fecha:'2026-03-01'},{id:uid(),desc:'Gastos comunes (cadenas y conos)',cat:'accesorios',monto:89000,quien:'miguel',fecha:'2026-03-01'},{id:uid(),desc:'Airtag',cat:'operativo',monto:148000,quien:'lucho',fecha:'2026-03-01'},{id:uid(),desc:'Cadena y candados',cat:'accesorios',monto:155000,quien:'lucho',fecha:'2026-03-01'},{id:uid(),desc:'Sunchos',cat:'operativo',monto:30000,quien:'lucho',fecha:'2026-03-01'}]

}

function sp(btn,name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  btn.classList.add('active');renderAll();
}

function toggleCompraOp(opId,idx){const op=state.ops.find(o=>o.id===opId);if(op)op.compra.echeqs[idx].pagado=!op.compra.echeqs[idx].pagado;scheduleSave();renderAll()}
function toggleVenta(opId,idx){const op=state.ops.find(o=>o.id===opId);if(op)op.venta.cuotas[idx].pagado=!op.venta.cuotas[idx].pagado;scheduleSave();renderAll()}
function saveTc(opId,idx,val){const op=state.ops.find(o=>o.id===opId);if(op&&op.venta.cuotas[idx])op.venta.cuotas[idx].tc=parseFloat(val)||null;scheduleSave()}
function toggleCompraStock(sId,idx){const s=state.stock.find(x=>x.id===sId);if(s)s.compra.echeqs[idx].pagado=!s.compra.echeqs[idx].pagado;scheduleSave();renderAll()}

function guardarGastoCompra(){
  const opId=document.getElementById('gc-op').value;const desc=document.getElementById('gc-desc').value.trim();const monto=parseFloat(document.getElementById('gc-monto').value)||0;
  if(!desc||!monto){alert('Completá descripción y monto.');return}
  const op=state.ops.find(o=>o.id===opId);
  if(op){op.compra.gastos.push({desc,monto});scheduleSave();}
  document.getElementById('gc-desc').value='';document.getElementById('gc-monto').value='';renderAll();
}
function guardarGasto(){
  const desc=document.getElementById('g-desc').value.trim();const monto=parseFloat(document.getElementById('g-monto').value)||0;
  if(!desc||!monto){alert('Completá descripción y monto.');return}
  state.gastos.unshift({id:uid(),desc,cat:document.getElementById('g-cat').value,monto,quien:document.getElementById('g-quien').value,fecha:document.getElementById('g-fecha').value});
  scheduleSave();['g-desc','g-monto'].forEach(id=>document.getElementById(id).value='');renderAll();
}
function elimGasto(id){if(!confirm('¿Eliminar?'))return;state.gastos=state.gastos.filter(g=>g.id!==id);scheduleSave();renderAll()}
function guardarStock(){
  const marca=document.getElementById('s-marca').value.trim();const modelo=document.getElementById('s-modelo').value.trim();
  if(!marca||!modelo){alert('Completá marca y modelo.');return}
  state.stock.unshift({id:uid(),marca,modelo,anio:document.getElementById('s-anio').value,precioUSD:parseFloat(document.getElementById('s-usd').value)||0,estado:'disponible',notas:document.getElementById('s-notas').value.trim(),compra:{costo:parseFloat(document.getElementById('s-costo').value)||0,gastos:[],echeqs:[]}});
  scheduleSave();['s-marca','s-modelo','s-anio','s-costo','s-usd','s-notas'].forEach(id=>document.getElementById(id).value='');renderAll();
}
function guardarVenta(){
  const cliente=document.getElementById('v-cliente').value.trim();const moto=document.getElementById('v-moto').value.trim();const usd=parseFloat(document.getElementById('v-usd').value)||0;
  if(!cliente||!moto||!usd){alert('Completá cliente, moto y precio.');return}
  const nc=parseInt(document.getElementById('v-cuotas').value)||1;const fecha=document.getElementById('v-fecha').value;
  const cuotas=[];for(let i=0;i<nc;i++){const f=new Date(fecha+'T12:00:00');f.setMonth(f.getMonth()+i);cuotas.push({label:'Cuota '+(i+1),fecha:f.toISOString().split('T')[0],usd:usd/nc,tc:null,pagado:false})}
  state.ops.unshift({id:uid(),nombre:moto,cliente,compra:{costo:parseFloat(document.getElementById('v-costo').value)||0,gastos:[],echeqs:[]},venta:{precioUSD:usd,cuotas}});
  scheduleSave();['v-cliente','v-moto','v-usd','v-costo','v-cuotas','v-notas'].forEach(id=>document.getElementById(id).value='');document.getElementById('v-fecha').value=hoy;renderAll();
}

function cobradoUSD(op){return op.venta.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+(c.usd||(c.ars?(c.ars/(c.tc||1)):0)),0)}

function exportarExcel(){
  const {ops,stock,gastos}=state;
  const wb=XLSX.utils.book_new();
  const comprasRows=[['Moto','Cliente','Echeq / Gasto','Fecha','Monto $','Estado']];
  [...ops,...stock.map(s=>({...s,cliente:'(stock)'}))].forEach(op=>{
    const c=op.compra;const nombre=op.nombre||(op.marca+' '+op.modelo);
    c.echeqs.forEach(e=>comprasRows.push([nombre,op.cliente||'',e.label,fmtF(e.fecha),e.monto,e.pagado?'Pagado':'Pendiente']));
    c.gastos.forEach(g=>comprasRows.push([nombre,op.cliente||'',g.desc,'-',g.monto,'Gasto extra']));
    comprasRows.push([nombre,op.cliente||'','COSTO TOTAL','-',c.costo+c.gastos.reduce((s,g)=>s+g.monto,0),'']);comprasRows.push([]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(comprasRows),'Compras');
  const ventasRows=[['Moto','Cliente','Cuota','Fecha','USD','TC','$ ARS','Estado']];
  ops.forEach(op=>{op.venta.cuotas.forEach(c=>{const usd=c.usd||(c.ars&&c.tc?c.ars/c.tc:null);const ars=c.ars||(c.usd&&c.tc?c.usd*c.tc:null);ventasRows.push([op.nombre,op.cliente,c.label,fmtF(c.fecha),usd?Math.round(usd):'',c.tc||'',ars?Math.round(ars):'',c.pagado?'Cobrado':'Pendiente'])});ventasRows.push([op.nombre,op.cliente,'TOTAL','-',op.venta.precioUSD,'','','']);ventasRows.push([]);});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ventasRows),'Ventas');
  const gastosRows=[['Descripción','Categoría','Monto $','A cargo de','Fecha']];
  gastos.forEach(g=>gastosRows.push([g.desc,g.cat,g.monto,g.quien,fmtF(g.fecha)]));
  gastosRows.push([]);gastosRows.push(['TOTAL','','',gastos.reduce((s,g)=>s+g.monto,0),'']);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gastosRows),'Gastos');
  XLSX.writeFile(wb,'EvaMotos_'+hoy+'.xlsx');
}

function renderStats(){
  const {ops,stock}=state;
  const totalUSD=ops.reduce((s,o)=>s+o.venta.precioUSD,0);
  const cobUSD=ops.reduce((s,o)=>s+cobradoUSD(o),0);
  const vencV=ops.reduce((s,o)=>s+o.venta.cuotas.filter(c=>!c.pagado&&c.fecha<hoy).length,0);
  const comprasPend=ops.reduce((s,o)=>s+o.compra.echeqs.filter(e=>!e.pagado).reduce((a,e)=>a+e.monto,0),0)+stock.reduce((s,x)=>s+x.compra.echeqs.filter(e=>!e.pagado).reduce((a,e)=>a+e.monto,0),0);
  document.getElementById('sbar').innerHTML=`
    <div class="stat"><div class="lbl">Cobrado</div><div class="val">${fmtU(cobUSD)}</div></div>
    <div class="stat"><div class="lbl">Por cobrar</div><div class="val a">${fmtU(totalUSD-cobUSD)}</div></div>
    <div class="stat"><div class="lbl">Cuotas vencidas</div><div class="val ${vencV>0?'r':'w'}">${vencV}</div></div>
    <div class="stat"><div class="lbl">Pagos compra pend.</div><div class="val w">${fmtS(comprasPend)}</div></div>
    <div class="stat"><div class="lbl">Stock</div><div class="val w">${stock.filter(s=>s.estado==='disponible').length}</div><div class="sub">motos disponibles</div></div>`;
}

function renderCompras(){
  const {ops,stock}=state;
  const sel=document.getElementById('gc-op');sel.innerHTML=ops.map(o=>`<option value="${o.id}">${o.nombre} — ${o.cliente}</option>`).join('');
  const renderB=(nombre,cliente,compra,fn,id)=>{
    const pag=compra.echeqs.filter(e=>e.pagado).reduce((s,e)=>s+e.monto,0);const tot=compra.echeqs.reduce((s,e)=>s+e.monto,0);
    const gT=compra.gastos.reduce((s,g)=>s+g.monto,0);const venc=compra.echeqs.filter(e=>!e.pagado&&e.fecha<hoy).length;const pct=tot>0?Math.round(pag/tot*100):0;
    return`<div class="card"><div class="card-head"><span style="color:var(--white);font-size:12px;font-weight:500">${nombre}${cliente?` <span style="color:#666;font-weight:400">— ${cliente}</span>`:''}</span><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--red);font-size:11px">${fmtS(pag)} / ${fmtS(tot)}</span>${venc>0?`<span class="badge br">${venc} venc.</span>`:''}</div></div>
    <table><thead><tr><th>Costo base</th><th>Gastos extra</th><th>Costo total</th><th>Pagado</th><th>Pendiente</th></tr></thead><tbody><tr><td class="re">${fmtS(compra.costo)}</td><td class="am">${fmtS(gT)}</td><td class="re">${fmtS(compra.costo+gT)}</td><td class="re">${fmtS(pag)} (${pct}%)</td><td class="re">${fmtS(tot-pag)}</td></tr></tbody></table>
    <div style="padding:4px 7px;font-size:9px;color:#3a3a3a;border-top:1px solid var(--border)">${compra.gastos.map(g=>g.desc+' '+fmtS(g.monto)).join(' · ')||'Sin gastos extra'}</div>
    ${compra.echeqs.map((e,i)=>`<div class="cr${!e.pagado&&e.fecha<hoy?' venc':''}"><span style="font-size:11px;color:#888;min-width:55px">${e.label}</span><span style="font-size:11px;color:#666;min-width:65px">${fmtF(e.fecha)}</span><span class="re" style="font-size:11px;min-width:100px">${fmtS(e.monto)}</span><div class="cbi"><input type="checkbox" ${e.pagado?'checked':''} onchange="${fn}('${id}',${i})" style="width:13px;height:13px;accent-color:#00e5cc"><span style="color:${e.pagado?'#00c97a':!e.pagado&&e.fecha<hoy?'var(--red)':'#444'}">${e.pagado?'Pagado':!e.pagado&&e.fecha<hoy?'VENCIDO':'Pendiente'}</span></div></div>`).join('')}</div>`;
  };
  document.getElementById('compras-content').innerHTML=ops.map(o=>renderB(o.nombre,o.cliente,o.compra,'toggleCompraOp',o.id)).join('')+stock.map(s=>renderB(s.marca+' '+s.modelo+' (stock)',null,s.compra,'toggleCompraStock',s.id)).join('');
}

function renderGastos(){
  const {gastos}=state;const qL={ambos:'Ambos',lucho:'Lucho',miguel:'Miguel'};
  document.getElementById('tgastos').innerHTML=gastos.length?`<table><thead><tr><th>Descripción</th><th>Cat.</th><th>Monto</th><th>Cargo</th><th>Fecha</th><th></th></tr></thead><tbody>${gastos.map(g=>`<tr><td>${g.desc}</td><td><span class="badge bc">${g.cat}</span></td><td class="cy">${fmtS(g.monto)}</td><td style="color:#666">${qL[g.quien]||g.quien}</td><td style="color:#555">${fmtF(g.fecha)}</td><td><button class="btn btnd" onclick="elimGasto('${g.id}')">del</button></td></tr>`).join('')}</tbody></table>`:'<div style="color:#333;font-size:11px;padding:8px">Sin gastos.</div>';
}

function renderVentas(){
  const {ops}=state;
  document.getElementById('ventas-content').innerHTML=ops.map(op=>{
    const cobUSD=cobradoUSD(op);const pct=op.venta.precioUSD>0?Math.round(cobUSD/op.venta.precioUSD*100):0;const venc=op.venta.cuotas.filter(c=>!c.pagado&&c.fecha<hoy).length;
    return`<div class="card"><div class="card-head"><span style="color:var(--white);font-size:12px;font-weight:500">${op.nombre} <span style="color:#666;font-weight:400">— ${op.cliente}</span></span><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--cyan);font-size:11px">${fmtU(cobUSD)} / ${fmtU(op.venta.precioUSD)} · ${pct}%</span>${venc>0?`<span class="badge br">${venc} venc.</span>`:`<span class="badge bg">${pct}%</span>`}</div></div>
    ${op.venta.cuotas.map((c,i)=>{const venc=!c.pagado&&c.fecha<hoy;const usdVal=c.usd||(c.ars&&c.tc?c.ars/c.tc:null);return`<div class="cr${venc?' venc':''}"><span style="font-size:11px;color:#888;min-width:65px">${c.label}</span><span style="font-size:11px;color:#666;min-width:65px">${fmtF(c.fecha)}</span><span class="cy" style="font-size:11px;min-width:90px">${c.ars?fmtS(c.ars):usdVal?fmtU(usdVal):'-'}</span><input class="tc-in" type="number" placeholder="TC" value="${c.tc||''}" onchange="saveTc('${op.id}',${i},this.value)" ${c.pagado?'disabled':''}><div class="cbi"><input type="checkbox" ${c.pagado?'checked':''} onchange="toggleVenta('${op.id}',${i})" style="width:13px;height:13px;accent-color:#00e5cc"><span style="color:${c.pagado?'#00c97a':venc?'var(--red)':'#444'}">${c.pagado?'Cobrado':venc?'VENCIDO':'Pendiente'}</span></div></div>`}).join('')}</div>`;
  }).join('');
}

function renderResumen(){
  const {ops,stock}=state;
  const venc=ops.reduce((s,o)=>s+o.venta.cuotas.filter(c=>!c.pagado&&c.fecha<hoy).length,0);
  const proxV=ops.flatMap(o=>o.venta.cuotas.filter(c=>!c.pagado&&c.fecha>=hoy).map(c=>({...c,op:o.nombre+' — '+o.cliente}))).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8);
  const proxC=[...ops.flatMap(o=>o.compra.echeqs.filter(e=>!e.pagado).map(e=>({...e,op:o.nombre+' — '+o.cliente}))),
    ...stock.flatMap(s=>s.compra.echeqs.filter(e=>!e.pagado).map(e=>({...e,op:s.marca+' '+s.modelo+' (stock)'})))].sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,8);
  let html=venc?`<div class="alert">${venc} cuota${venc>1?'s':''} vencida${venc>1?'s':''} sin cobrar</div>`:'';
  html+=`<div class="two"><div><div class="sec">Próximos cobros</div><table><thead><tr><th>Fecha</th><th>Operación</th><th>USD</th></tr></thead><tbody>${proxV.length?proxV.map(c=>`<tr><td>${fmtF(c.fecha)}</td><td style="color:#555">${c.op}</td><td class="cy">${fmtU(c.usd||(c.ars?(c.ars/(c.tc||1)):0))}</td></tr>`).join(''):'<tr><td colspan="3" style="color:#333;text-align:center;padding:10px">Todo al día</td></tr>'}</tbody></table></div>
  <div><div class="sec">Próximos pagos de compra</div><table><thead><tr><th>Fecha</th><th>Operación</th><th>$</th></tr></thead><tbody>${proxC.length?proxC.map(e=>`<tr><td style="${e.fecha<hoy?'color:var(--red)':''}">${fmtF(e.fecha)}</td><td style="color:#555">${e.op}</td><td class="re">${fmtS(e.monto)}</td></tr>`).join(''):'<tr><td colspan="3" style="color:#333;text-align:center;padding:10px">Sin pagos pendientes</td></tr>'}</tbody></table></div></div>`;
  document.getElementById('dash').innerHTML=html;
}

function renderStock(){
  const {stock}=state;
  document.getElementById('stock-content').innerHTML=stock.map(s=>`<div class="card"><div class="card-head"><div><span style="color:var(--white);font-weight:500;font-size:13px">${s.marca} ${s.modelo} ${s.anio||''}</span>${s.notas?`<div style="font-size:10px;color:#555;margin-top:1px">${s.notas}</div>`:''}</div><div style="display:flex;gap:8px;align-items:center"><span class="badge ba">En stock</span><span style="color:var(--amber);font-size:11px">USD ${(s.precioUSD||0).toLocaleString('es-AR')}</span></div></div><table><thead><tr><th>Costo base</th><th>Gastos extra</th><th>Costo total</th></tr></thead><tbody><tr><td class="re">${fmtS(s.compra.costo)}</td><td class="am">${fmtS(s.compra.gastos.reduce((a,g)=>a+g.monto,0))}</td><td class="re">${fmtS(s.compra.costo+s.compra.gastos.reduce((a,g)=>a+g.monto,0))}</td></tr></tbody></table></div>`).join('')||'<div style="color:#333;padding:12px;font-size:11px">Sin motos en stock.</div>';
}

function renderAll(){renderStats();renderCompras();renderGastos();renderVentas();renderResumen();renderStock()}

// Auto-refresh cada 30 segundos para ver cambios del otro usuario
setInterval(loadData, 30000);

loadData();
</script>
